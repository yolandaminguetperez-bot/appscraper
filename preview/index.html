<title>AppScraper Preview</title>
<style>
  :root {
    --bg: #f6f8f6;
    --surface: #ffffff;
    --surface-muted: #eef2ee;
    --ink: #101511;
    --ink-muted: #6b7670;
    --ink-faint: #9aa49e;
    --line: #e2e8e3;
    --accent: #16c46a;
    --accent-soft: #e6f7ee;
    --accent-ink: #0d8a49;
    --panel: #0c110e;
    --panel-soft: #141b16;
    --panel-line: #242e27;
    --panel-ink: #f2f6f3;
    --panel-ink-muted: #96a39b;
    --chart-line: #0d8a49;
    --chart-fill: #16c46a;
    --chart-grid: #e7ece8;
    --shadow: 0 1px 2px rgba(16,21,17,.04), 0 8px 24px -16px rgba(16,21,17,.18);
    --shadow-hi: 0 1px 2px rgba(16,21,17,.05), 0 16px 36px -20px rgba(16,21,17,.28);
    --radius: 16px;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0e0c; --surface: #111714; --surface-muted: #1a221d;
      --ink: #eef3ef; --ink-muted: #9aa8a0; --ink-faint: #7d8b84; --line: #232d27;
      --accent-soft: #14271d; --accent-ink: #4ade8a;
      --panel: #070b09; --panel-soft: #121a15; --panel-line: #212a24;
      --chart-line: #12a659; --chart-fill: #12a659; --chart-grid: #232d27;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.7);
      --shadow-hi: 0 1px 2px rgba(0,0,0,.5), 0 18px 40px -20px rgba(0,0,0,.85);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0e0c; --surface: #111714; --surface-muted: #1a221d;
    --ink: #eef3ef; --ink-muted: #9aa8a0; --ink-faint: #7d8b84; --line: #232d27;
    --accent-soft: #14271d; --accent-ink: #4ade8a;
    --panel: #070b09; --panel-soft: #121a15; --panel-line: #212a24;
    --chart-line: #12a659; --chart-fill: #12a659; --chart-grid: #232d27;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.7);
    --shadow-hi: 0 1px 2px rgba(0,0,0,.5), 0 18px 40px -20px rgba(0,0,0,.85);
  }

  html, body { height: 100%; }
  body {
    margin: 0; background: var(--panel); color: var(--ink);
    font-family: var(--sans); -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  button, input, select { font: inherit; color: inherit; }
  :where(a, button, input, select, [tabindex]):focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px;
  }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }

  .shell { display: flex; height: 100%; }
  .rail {
    width: 236px; flex: 0 0 236px; background: var(--panel); color: var(--panel-ink);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 16px 14px; font-weight: 650; letter-spacing: -.01em; }
  .brand i { width: 34px; height: 34px; border-radius: 11px; background: var(--panel-soft); display: grid; place-items: center; }
  .brand i span { width: 13px; height: 13px; border-radius: 5px; background: var(--accent); }
  .rail h2 {
    margin: 16px 0 6px; padding: 0 18px; font-size: 10.5px; font-weight: 650;
    letter-spacing: .12em; text-transform: uppercase; color: var(--panel-ink-muted);
  }
  .rail nav { display: flex; flex-direction: column; gap: 2px; padding: 0 10px; }
  .rail button.nav {
    display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 12px;
    background: none; border: 0; border-radius: 12px; cursor: pointer;
    color: var(--panel-ink-muted); font-size: 13.5px; text-align: left;
  }
  .rail button.nav:hover { background: var(--panel-soft); color: var(--panel-ink); }
  .rail button.nav[aria-current="true"] { background: var(--panel-soft); color: var(--panel-ink); box-shadow: inset 0 0 0 1px rgba(22,196,106,.5); }
  .rail .foot { margin-top: auto; padding: 12px; border-top: 1px solid var(--panel-line); }
  .themes { display: flex; gap: 2px; background: var(--panel-soft); border-radius: 12px; padding: 4px; }
  .themes button {
    flex: 1; padding: 6px 4px; border: 0; border-radius: 9px; background: none; cursor: pointer;
    color: var(--panel-ink-muted); font-size: 11.5px;
  }
  .themes button[aria-pressed="true"] { background: rgba(22,196,106,.16); color: var(--accent); }

  main {
    flex: 1; min-width: 0; margin: 8px 8px 8px 0; border-radius: 18px; background: var(--bg);
    box-shadow: inset 0 0 0 1px var(--line); overflow-y: auto;
    background-image: radial-gradient(color-mix(in oklab, var(--line) 70%, transparent) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  .wrap { padding: 22px 26px 40px; }
  .note {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline;
    margin-bottom: 18px; padding: 10px 14px; border-radius: 12px;
    background: var(--accent-soft); color: var(--accent-ink); font-size: 12.5px;
  }
  .note b { font-weight: 650; }
  h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
  .sub { margin: 4px 0 0; color: var(--ink-muted); font-size: 13.5px; }
  .head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card.hover { transition: box-shadow .18s ease, border-color .18s ease, transform .18s ease; }
  .card.hover:hover { transform: translateY(-2px); box-shadow: var(--shadow-hi); border-color: color-mix(in oklab, var(--accent) 35%, var(--line)); }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .field { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
  .field input, .field select { border: 0; background: none; outline: none; min-width: 0; }
  .field input { width: 260px; }
  .pill { padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink-muted); cursor: pointer; font-size: 13px; }
  .pill[aria-pressed="true"] { border-color: color-mix(in oklab, var(--accent) 40%, var(--line)); background: var(--accent-soft); color: var(--accent-ink); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .tablewrap { overflow-x: auto; }
  thead th {
    position: sticky; top: 0; z-index: 1; background: var(--surface-muted);
    text-align: left; font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--ink-muted); font-weight: 600; padding: 11px 14px; white-space: nowrap;
  }
  thead th.num { text-align: right; }
  thead th button { background: none; border: 0; cursor: pointer; color: inherit; font: inherit; display: inline-flex; gap: 5px; align-items: center; }
  tbody td { padding: 11px 14px; border-top: 1px solid var(--line); white-space: nowrap; }
  tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: color-mix(in oklab, var(--surface-muted) 55%, transparent); }
  .appcell { display: flex; align-items: center; gap: 11px; }
  .appcell strong { display: block; font-weight: 600; font-size: 13.5px; }
  .appcell span { display: block; color: var(--ink-muted); font-size: 12px; }
  .ico { width: 36px; height: 36px; border-radius: 9px; flex: 0 0 auto; }

  .grid { display: grid; gap: 16px; }
  .g4 { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .g6 { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .tile { overflow: hidden; display: flex; flex-direction: column; }
  .media { position: relative; aspect-ratio: 9/16; background: var(--panel); cursor: pointer; border: 0; padding: 0; width: 100%; display: block; }
  .media video, .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .media .veil { position: absolute; inset: 0; background: linear-gradient(to top, rgba(8,12,10,.92), rgba(8,12,10,.08) 55%, transparent); }
  .media .copy { position: absolute; left: 10px; right: 10px; bottom: 10px; color: #fff; text-align: left; }
  .media .copy b { display: block; font-size: 12px; font-weight: 600; line-height: 1.35; }
  .media .cta { display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: #06130c; font-size: 10.5px; font-weight: 650; }
  .tag { position: absolute; top: 8px; border-radius: 999px; background: rgba(8,12,10,.7); color: #fff; font-size: 10.5px; padding: 3px 8px; }
  .tag.l { left: 8px; } .tag.r { right: 8px; }
  .play { position: absolute; inset: 0; display: grid; place-items: center; }
  .play span { width: 42px; height: 42px; border-radius: 50%; background: rgba(8,12,10,.62); color: #fff; display: grid; place-items: center; font-size: 15px; }
  .tilefoot { display: flex; align-items: center; gap: 8px; padding: 9px 11px; font-size: 12.5px; }
  .tilestats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px 11px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink-muted); }
  .tilestats b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .kpis { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin-bottom: 16px; }
  .kpi { padding: 18px 20px; }
  .kpi dt { color: var(--ink-muted); font-size: 12.5px; }
  .kpi dd { margin: 6px 0 0; font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .kpi small { color: var(--ink-faint); font-size: 11.5px; }
  .bars { padding: 20px; }
  .bars h3, .panel h3 { margin: 0 0 4px; font-size: 15px; font-weight: 650; }
  .bars p, .panel p.sub2 { margin: 0 0 14px; color: var(--ink-muted); font-size: 12.5px; }
  .barrow { display: grid; grid-template-columns: minmax(0,110px) 1fr auto; gap: 12px; align-items: center; margin-bottom: 10px; font-size: 12.5px; }
  .barrow em { font-style: normal; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bartrack { height: 20px; position: relative; }
  .bartrack i { position: absolute; inset: 0 auto 0 0; border-radius: 0 4px 4px 0; background: var(--chart-fill); }
  .barrow b { font-variant-numeric: tabular-nums; font-weight: 600; }

  dialog {
    border: 0; padding: 0; border-radius: 18px; background: var(--surface); color: var(--ink);
    max-width: min(760px, 92vw); box-shadow: var(--shadow-hi);
  }
  dialog::backdrop { background: rgba(6,10,8,.72); }
  .lightbox { display: flex; gap: 18px; padding: 16px; flex-wrap: wrap; }
  .lightbox video { width: 240px; aspect-ratio: 9/16; border-radius: 12px; background: var(--panel); object-fit: cover; }
  .lightbox .meta { flex: 1; min-width: 220px; }
  .lightbox h3 { margin: 0 0 6px; font-size: 16px; }
  .lightbox p { margin: 0 0 14px; color: var(--ink-muted); font-size: 13.5px; line-height: 1.5; }
  .lightbox dl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; font-size: 12.5px; }
  .lightbox dt { color: var(--ink-faint); }
  .lightbox dd { margin: 2px 0 0; font-weight: 600; }
  .closebtn { position: absolute; top: 10px; right: 12px; border: 0; background: none; cursor: pointer; color: var(--ink-muted); font-size: 18px; }

  .empty { padding: 48px; text-align: center; color: var(--ink-muted); font-size: 13.5px; border: 1px dashed var(--line); border-radius: var(--radius); }
  .count { color: var(--ink-muted); font-size: 12.5px; margin-top: 12px; }

  @media (max-width: 820px) {
    .rail { position: fixed; inset: 0 auto 0 0; z-index: 30; transform: translateX(-100%); transition: transform .2s ease; }
    .rail.open { transform: none; }
    main { margin: 8px; }
    .menu { display: inline-flex !important; }
    .field input { width: 150px; }
  }
  .menu { display: none; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13px; }
</style>

<div class="shell">
  <aside class="rail" id="rail">
    <div class="brand"><i><span></span></i> AppScraper</div>
    <h2>Explore</h2>
    <nav id="nav"></nav>
    <div class="foot">
      <div class="themes" role="group" aria-label="Theme">
        <button type="button" data-theme-set="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
        <button type="button" data-theme-set="system" aria-pressed="true">System</button>
      </div>
    </div>
  </aside>

  <main id="main">
    <div class="wrap">
      <p class="note">
        <b>Static preview.</b>
        A snapshot of the AppScraper dashboard running on generated sample data &#8212; the filters,
        sorting, charts and video playback are live; there is no server behind it.
      </p>
      <div class="head">
        <div>
          <button class="menu" type="button" id="menu">&#9776; Menu</button>
          <h1 id="title">Explore Apps</h1>
          <p class="sub" id="subtitle">Search every app on the App Store and Google Play.</p>
        </div>
      </div>
      <div id="view"></div>
    </div>
  </main>
</div>

<dialog id="lb"><button class="closebtn" id="lbclose" aria-label="Close">&#10005;</button><div class="lightbox" id="lbbody"></div></dialog>

<script>
(async function () {
  const res = await fetch("data.json");
  const DATA = await res.json();

  /* ---- theme ---------------------------------------------------------- */
  const root = document.documentElement;
  const setTheme = (mode) => {
    if (mode === "system") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", mode);
    try { mode === "system" ? localStorage.removeItem("t") : localStorage.setItem("t", mode); } catch {}
    document.querySelectorAll("[data-theme-set]").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.themeSet === mode)));
  };
  document.querySelectorAll("[data-theme-set]").forEach((b) =>
    b.addEventListener("click", () => setTheme(b.dataset.themeSet)));
  try { const t = localStorage.getItem("t"); if (t) setTheme(t); } catch {}

  document.getElementById("menu").addEventListener("click", () =>
    document.getElementById("rail").classList.toggle("open"));

  /* ---- formatting ----------------------------------------------------- */
  const nf = new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 1 });
  const num = (v) => (v == null ? "&#8212;" : nf.format(v));
  const money = (v) => (v == null ? "&#8212;" : v === 0 ? "$0" : "$" + nf.format(v));
  const stars = (v) => (v == null ? "&#8212;" : v.toFixed(1));
  const ago = (iso) => {
    if (!iso) return "&#8212;";
    const d = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
    if (d < 30) return d + "d ago";
    if (d < 365) return Math.floor(d / 30) + "mo ago";
    return Math.floor(d / 365) + "y ago";
  };

  /* ---- generated app marks (same algorithm as the app) ---------------- */
  const PAL = [["#0f9d58","#4ade80"],["#0b7285","#38d9a9"],["#4c1d95","#a78bfa"],["#9d174d","#fb7185"],
    ["#b45309","#fcd34d"],["#1e40af","#60a5fa"],["#166534","#86efac"],["#7e22ce","#e879f9"],
    ["#9f1239","#fda4af"],["#3730a3","#818cf8"],["#c2410c","#fdba74"],["#065f46","#5eead4"],
    ["#0c4a6e","#7dd3fc"],["#831843","#f9a8d4"]];
  const hash = (s) => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  const GLYPH = (i, ink) => [
    `<circle cx="50" cy="50" r="20" fill="none" stroke="${ink}" stroke-width="10" stroke-linecap="round" stroke-dasharray="74 40" transform="rotate(-45 50 50)"/>`,
    `<path d="M30 64 L50 30 L70 64 Z" fill="${ink}"/>`,
    `<g fill="${ink}"><rect x="28" y="48" width="11" height="24" rx="5.5"/><rect x="44.5" y="34" width="11" height="38" rx="5.5"/><rect x="61" y="26" width="11" height="46" rx="5.5"/></g>`,
    `<path d="M30 50 q20 -28 40 0 q-20 28 -40 0 Z" fill="${ink}"/>`,
    `<g fill="${ink}"><circle cx="37" cy="37" r="10"/><circle cx="63" cy="37" r="10"/><circle cx="37" cy="63" r="10"/><circle cx="63" cy="63" r="10"/></g>`,
    `<path d="M32 68 L50 30 L68 68" fill="none" stroke="${ink}" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>`,
    `<path d="M50 26 L74 50 L50 74 L26 50 Z" fill="none" stroke="${ink}" stroke-width="9" stroke-linejoin="round"/>`,
    `<g fill="none" stroke="${ink}" stroke-width="9" stroke-linecap="round"><path d="M30 62 q20 -34 40 0"/><circle cx="50" cy="34" r="4.5" fill="${ink}" stroke="none"/></g>`,
    `<g fill="${ink}"><rect x="27" y="27" width="20" height="20" rx="6"/><rect x="53" y="27" width="20" height="20" rx="10"/><rect x="27" y="53" width="20" height="20" rx="10"/><rect x="53" y="53" width="20" height="20" rx="6"/></g>`,
    `<path d="M50 24 L60 42 L80 46 L65 60 L69 80 L50 70 L31 80 L35 60 L20 46 L40 42 Z" fill="${ink}"/>`,
  ][i % 10];
  const iconFor = (id) => {
    const h = hash(id), [deep, bright] = PAL[h % PAL.length], k = h.toString(36);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs>
<linearGradient id="a${k}" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(${((h>>16)%8)*45} .5 .5)">
<stop offset="0" stop-color="${bright}"/><stop offset="1" stop-color="${deep}"/></linearGradient>
<linearGradient id="b${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs><rect width="100" height="100" rx="26" fill="url(#a${k})"/><rect width="100" height="100" rx="26" fill="url(#b${k})"/>
${GLYPH((h >> 8) % 10, "rgba(255,255,255,.95)")}</svg>`;
    return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
  };

  const spark = (values) => {
    if (!values || values.length < 2) return "";
    const pts = values.slice(-24), min = Math.min(...pts), max = Math.max(...pts), span = max - min || 1;
    const co = pts.map((v, i) => [(i / (pts.length - 1)) * 100, 3 + (1 - (v - min) / span) * 26]);
    const line = co.map(([x, y], i) => (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1)).join(" ");
    const rising = pts[pts.length - 1] >= pts[0];
    const stroke = rising ? "var(--chart-line)" : "var(--ink-faint)";
    return `<svg viewBox="0 0 100 32" preserveAspectRatio="none" style="width:96px;height:32px" aria-hidden="true">
<path d="${line} L100,32 L0,32 Z" fill="var(--chart-fill)" opacity="${rising ? .13 : .07}"/>
<path d="${line}" fill="none" stroke="${stroke}" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
  };

  /* ---- views ---------------------------------------------------------- */
  const VIEWS = [
    { id: "overview", label: "Overview", title: "Overview", sub: "The whole catalogue at a glance." },
    { id: "apps", label: "Apps", title: "Explore Apps", sub: "Search every app on the App Store and Google Play." },
    { id: "ads", label: "Ads", title: "Ads Library", sub: "Every creative we have on file." },
    { id: "organic", label: "Organic", title: "Organic Content", sub: "Creator videos driving installs." },
  ];

  const nav = document.getElementById("nav");
  nav.innerHTML = VIEWS.map((v) =>
    `<button class="nav" type="button" data-view="${v.id}">${v.label}</button>`).join("");

  const viewEl = document.getElementById("view");
  const state = { view: "apps", q: "", cat: "", store: "", sort: "revenue", dir: -1, layout: "table" };

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function filteredApps() {
    const q = state.q.trim().toLowerCase();
    let rows = DATA.apps.filter((a) =>
      (!q || a.title.toLowerCase().includes(q) || (a.developer ?? "").toLowerCase().includes(q)) &&
      (!state.cat || a.category === state.cat) &&
      (!state.store || a.store === state.store));
    const key = state.sort;
    rows.sort((a, b) => {
      const x = key === "title" ? a.title.localeCompare(b.title) : (a[key] ?? 0) - (b[key] ?? 0);
      return state.dir * x;
    });
    return rows;
  }

  function appsView() {
    const rows = filteredApps();
    const cats = [...new Set(DATA.apps.map((a) => a.category).filter(Boolean))].sort();
    const head = (label, key, cls = "") =>
      `<th class="${cls}" ${state.sort === key ? `aria-sort="${state.dir < 0 ? "descending" : "ascending"}"` : ""}>
        <button type="button" data-sort="${key}">${label}<span aria-hidden="true">${state.sort === key ? (state.dir < 0 ? "&#8595;" : "&#8593;") : "&#8645;"}</span></button></th>`;

    const controls = `<div class="controls">
      <label class="field"><span aria-hidden="true">&#9906;</span><input id="q" type="search" placeholder="Search apps or developers…" value="${esc(state.q)}" aria-label="Search apps"></label>
      <label class="field"><select id="cat" aria-label="Category"><option value="">All categories</option>${cats.map((c) => `<option ${state.cat === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></label>
      <label class="field"><select id="store" aria-label="Store"><option value="">Both stores</option><option value="ios" ${state.store === "ios" ? "selected" : ""}>App Store</option><option value="android" ${state.store === "android" ? "selected" : ""}>Google Play</option></select></label>
      <button class="pill" type="button" data-layout="table" aria-pressed="${state.layout === "table"}">Table</button>
      <button class="pill" type="button" data-layout="cards" aria-pressed="${state.layout === "cards"}">Cards</button>
    </div>`;

    if (rows.length === 0) return controls + `<div class="empty">No apps match those filters.</div>`;

    const body = state.layout === "table"
      ? `<div class="card tablewrap"><table>
          <thead><tr>${head("App", "title")}<th>Category</th>${head("Rating", "rating", "num")}${head("Reviews", "reviews", "num")}${head("Downloads", "downloads", "num")}<th class="num">MRR</th><th>Revenue, 30d</th>${head("Revenue", "revenue", "num")}${head("Released", "released", "num")}</tr></thead>
          <tbody>${rows.map((a) => `<tr>
            <td><div class="appcell"><img class="ico" src="${iconFor(a.id)}" alt=""><div><strong>${esc(a.title)}</strong><span>${esc(a.developer)}</span></div></div></td>
            <td style="color:var(--ink-muted)">${esc(a.category)}</td>
            <td class="num">&#9734; ${stars(a.rating)}</td>
            <td class="num">${num(a.reviews)}</td>
            <td class="num">${num(a.downloads)}</td>
            <td class="num">${money(a.mrr)}</td>
            <td>${spark(DATA.trends[a.id])}</td>
            <td class="num">${money(a.revenue)}</td>
            <td class="num" style="color:var(--ink-muted)">${ago(a.released)}</td>
          </tr>`).join("")}</tbody></table></div>`
      : `<div class="grid g4">${rows.map((a) => `<article class="card hover tile">
          <div style="display:flex;gap:14px;padding:18px 18px 14px">
            <img class="ico" style="width:52px;height:52px;border-radius:13px" src="${iconFor(a.id)}" alt="">
            <div style="min-width:0;flex:1">
              <strong style="display:block;font-size:16px;letter-spacing:-.01em">${esc(a.title)}</strong>
              <span style="display:block;color:var(--ink-muted);font-size:13px">${esc(a.developer)}</span>
              <span style="display:inline-block;margin-top:8px;padding:2px 8px;border-radius:999px;background:var(--surface-muted);color:var(--ink-muted);font-size:11.5px">${esc(a.category)}</span>
              <span style="display:inline-block;margin-top:8px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:11.5px;font-weight:600">&#9734; ${stars(a.rating)}</span>
            </div>
          </div>
          <dl style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0;padding:12px 18px;border-top:1px solid var(--line)">
            <div><dt style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint)">Downloads</dt><dd style="margin:2px 0 0;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums">${num(a.downloads)}</dd></div>
            <div><dt style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint)">MRR</dt><dd style="margin:2px 0 0;font-size:15px;font-weight:650;color:var(--accent-ink);font-variant-numeric:tabular-nums">${money(a.mrr)}</dd></div>
            <div><dt style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint)">Reviews</dt><dd style="margin:2px 0 0;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums">${num(a.reviews)}</dd></div>
          </dl>
          <div style="margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 18px;border-top:1px solid var(--line);background:color-mix(in oklab, var(--surface-muted) 40%, transparent)">
            ${spark(DATA.trends[a.id])}
            <span style="text-align:right;font-size:11.5px;color:var(--ink-faint);line-height:1.35">${money(a.revenue)} lifetime<br>released ${ago(a.released)}</span>
          </div>
        </article>`).join("")}</div>`;

    return controls + body + `<p class="count">${rows.length} of ${DATA.apps.length} apps</p>`;
  }

  const mediaTile = (item, badge, copy) => `
    <button class="media" type="button" data-open="${item.id}">
      <video src="media/${item.media}" poster="media/${item.poster}" muted loop playsinline preload="none"></video>
      <span class="veil"></span>
      <span class="tag l">${item.kind === "image" ? "Image" : "Video"}</span>
      <span class="tag r">${badge}</span>
      <span class="play"><span>&#9654;</span></span>
      <span class="copy">${copy}</span>
    </button>`;

  function adsView() {
    return `<div class="grid g6">${DATA.creatives.map((c) => `<article class="card hover tile">
      ${mediaTile(c, c.days + "d", `<b>${esc(c.headline)}</b><span class="cta">${esc(c.cta)}</span>`)}
      <div class="tilefoot"><img class="ico" style="width:24px;height:24px;border-radius:7px" src="${iconFor(c.appId)}" alt=""><strong style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.appTitle)}</strong></div>
    </article>`).join("")}</div>`;
  }

  function organicView() {
    return `<div class="grid g4">${DATA.organic.map((o) => `<article class="card hover tile">
      ${mediaTile(o, o.platform, `<b>${esc(o.caption)}</b><span style="display:block;margin-top:2px;font-size:10.5px;opacity:.8">${esc(o.author)}</span>`)}
      <div class="tilefoot"><img class="ico" style="width:24px;height:24px;border-radius:7px" src="${iconFor(o.appId)}" alt=""><strong style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.appTitle)}</strong></div>
      <div class="tilestats"><span>&#9673; <b>${num(o.views)}</b></span><span>&#9825; <b>${num(o.likes)}</b></span><span>&#9993; <b>${num(o.comments)}</b></span></div>
    </article>`).join("")}</div>`;
  }

  function overviewView() {
    const t = DATA.totals, c = DATA.counts;
    const peak = Math.max(...DATA.categories.map((x) => x.value), 1);
    const top = [...DATA.apps].sort((a, b) => b.revenue - a.revenue).slice(0, 5);
    return `
      <dl class="kpis">
        <div class="card kpi"><dt>Apps tracked</dt><dd>${t.apps.toLocaleString()}</dd><small>${t.ios.toLocaleString()} App Store &#183; ${(t.apps - t.ios).toLocaleString()} Google Play</small></div>
        <div class="card kpi"><dt>Combined MRR</dt><dd>${money(t.mrr)}</dd><small>Estimated across every app on file</small></div>
        <div class="card kpi"><dt>Creatives on file</dt><dd>${c.creatives.toLocaleString()}</dd><small>${c.organic.toLocaleString()} creator videos</small></div>
        <div class="card kpi"><dt>Onboarding flows</dt><dd>${c.flows.toLocaleString()}</dd><small>Captured screen by screen</small></div>
      </dl>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
        <section class="card bars">
          <h3>Revenue by category</h3><p>Combined monthly estimate.</p>
          ${DATA.categories.map((x) => `<div class="barrow"><em>${esc(x.label)}</em>
            <span class="bartrack"><i style="width:${Math.max((x.value / peak) * 100, 2)}%"></i></span>
            <b>${money(x.value)}</b></div>`).join("")}
        </section>
        <section class="card bars">
          <h3>Top apps by lifetime revenue</h3><p>Across the whole catalogue.</p>
          ${top.map((a) => `<div style="display:flex;align-items:center;gap:11px;padding:8px 0;border-top:1px solid var(--line)">
            <img class="ico" style="width:32px;height:32px;border-radius:8px" src="${iconFor(a.id)}" alt="">
            <div style="min-width:0;flex:1"><strong style="display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.title)}</strong>
            <span style="color:var(--ink-muted);font-size:12px">${esc(a.category)}</span></div>
            ${spark(DATA.trends[a.id])}
            <b style="font-variant-numeric:tabular-nums;font-size:13px">${money(a.revenue)}</b></div>`).join("")}
        </section>
      </div>`;
  }

  function render() {
    const v = VIEWS.find((x) => x.id === state.view);
    document.getElementById("title").textContent = v.title;
    document.getElementById("subtitle").textContent = v.sub;
    document.querySelectorAll("[data-view]").forEach((b) =>
      b.setAttribute("aria-current", String(b.dataset.view === state.view)));
    viewEl.innerHTML =
      state.view === "apps" ? appsView() :
      state.view === "ads" ? adsView() :
      state.view === "organic" ? organicView() : overviewView();
  }

  /* ---- interaction ---------------------------------------------------- */
  document.addEventListener("click", (e) => {
    const view = e.target.closest("[data-view]");
    if (view) { state.view = view.dataset.view; document.getElementById("rail").classList.remove("open"); render(); return; }

    const sort = e.target.closest("[data-sort]");
    if (sort) {
      const key = sort.dataset.sort;
      if (state.sort === key) state.dir = -state.dir; else { state.sort = key; state.dir = -1; }
      render(); return;
    }

    const layout = e.target.closest("[data-layout]");
    if (layout) { state.layout = layout.dataset.layout; render(); return; }

    const open = e.target.closest("[data-open]");
    if (open) {
      const id = open.dataset.open;
      const item = DATA.creatives.find((c) => c.id === id) ?? DATA.organic.find((o) => o.id === id);
      if (item) openLightbox(item);
    }
  });

  viewEl.addEventListener("input", (e) => {
    if (e.target.id === "q") { state.q = e.target.value; const pos = e.target.selectionStart; render();
      const next = document.getElementById("q"); if (next) { next.focus(); next.setSelectionRange(pos, pos); } }
  });
  viewEl.addEventListener("change", (e) => {
    if (e.target.id === "cat") { state.cat = e.target.value; render(); }
    if (e.target.id === "store") { state.store = e.target.value; render(); }
  });

  /* Hover plays the clip, as it does in the real library. */
  viewEl.addEventListener("pointerover", (e) => {
    const m = e.target.closest(".media"); if (!m) return;
    const v = m.querySelector("video"); if (v) v.play().catch(() => {});
  });
  viewEl.addEventListener("pointerout", (e) => {
    const m = e.target.closest(".media"); if (!m) return;
    const v = m.querySelector("video"); if (v) { v.pause(); v.currentTime = 0; }
  });

  const lb = document.getElementById("lb"), lbBody = document.getElementById("lbbody");
  document.getElementById("lbclose").addEventListener("click", () => lb.close());
  lb.addEventListener("click", (e) => { if (e.target === lb) lb.close(); });

  function openLightbox(item) {
    const isAd = "headline" in item;
    lbBody.innerHTML = `
      <video src="media/${item.media}" poster="media/${item.poster}" controls autoplay muted loop playsinline></video>
      <div class="meta">
        <h3>${esc(isAd ? item.headline : item.caption)}</h3>
        <p>${esc(isAd ? item.body : item.author + " &#183; " + item.platform)}</p>
        <dl>${(isAd
          ? [["App", item.appTitle], ["Running", item.days + " days"], ["Format", item.kind], ["Call to action", item.cta]]
          : [["App", item.appTitle], ["Views", num(item.views)], ["Likes", num(item.likes)], ["Comments", num(item.comments)]]
        ).map(([k, val]) => `<div><dt>${k}</dt><dd>${esc(val)}</dd></div>`).join("")}</dl>
      </div>`;
    lb.showModal();
  }

  render();
})();
</script>
